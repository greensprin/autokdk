CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_POINTING=y
CONFIG_PAW3222=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --- BLE tuning (電波環境の改善) ---
#
# 2M PHY を無効化して 1M PHY に固定する。2M は転送が速い代わりに受信感度が
# 約 3dB 悪く、混雑した 2.4GHz 帯では取りこぼしが増える。1M に落とすことで
# リンクマージンを稼ぎ、接続の安定性を優先する。
# (ホスト側アダプタの 2M PHY 実装に起因する不具合の切り分けも兼ねる)
CONFIG_BT_CTLR_PHY_2M=n

# nRF52840 の送信出力を既定の 0dBm から +8dBm に引き上げてリンクマージンを稼ぐ。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
